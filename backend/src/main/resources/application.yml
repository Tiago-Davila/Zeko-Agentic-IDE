spring:
  application:
    name: zeko
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never

server:
  address: 127.0.0.1
  port: 8080
  forward-headers-strategy: none

zeko:
  datasource:
    path: ${user.dir}/data/zeko.db
    busy-timeout: 5s
    max-pool-size: 4
    migration-lock-timeout: 30s
  session:
    ttl: 30m
